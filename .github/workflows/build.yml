name: Build S26U GKI

# Builds the Android Common Kernel (ACK) android15-6.6 GKI for the itel S26 Ultra
# (S688LN / Unisoc T7300 / ums9360). Runs on GitHub's FREE public runners because
# Actions is billing-blocked on the private repo.
#
# profile:
#   stock      - zero source/config changes. Pure ACK GKI. KMI 100% intact.
#                THIS IS THE FIRST MILESTONE: it proves the checkout + Kleaf build
#                + boot.img pack chain and produces a boot.img you `fastboot boot`
#                (NOT flash) to confirm vendor modules still load.
#   safe       - stock + KMI-SAFE tuning only: default TCP=bbr, zram default=zstd.
#                No ABI/struct changes -> prebuilt vendor modules unaffected.
#   aggressive - safe + ThinLTO + strip debug bloat (KASAN/KFENCE/lockup/
#                sched_debug/ftrace/profiling). Bigger wins but CAN perturb the
#                KMI -> the fastboot-boot probe is mandatory before trusting it.
#   ksun       - safe tuning + KernelSU-Next v3.3.0 compiled INTO the kernel
#                (kprobe hooks, additive, no core-source patches). Root lives in
#                our signed Image; init_boot untouched. KSU edits common/drivers
#                so the uname is no longer byte-identical to stock (release gate
#                is relaxed to a prefix match for this profile). The fastboot-boot
#                probe is the real gate: verify KSU manager=Working + WiFi + BT.

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Build profile"
        type: choice
        options: [stock, safe, aggressive, ksun]
        default: stock

permissions:
  contents: write

env:
  ACK_BRANCH: common-android15-6.6
  # v0.2 FIX: pin common/ to the EXACT stock ACK commit so every exported-symbol
  # MODVERSIONS CRC is byte-identical to the device's stock kernel. v0.1 built ACK
  # tip (6.6.139): the phone booted + display worked (vermagic flag-tail matched)
  # but the Unisoc WCN/wlan module chain (sprd_wlan_combo -> cfg80211 -> unisoc_wcn_bsp)
  # was REJECTED on CRC drift between 6.6.102 and 6.6.139 -> WiFi never came up.
  # With MODVERSIONS the loader skips UTS_RELEASE (same_magic strips the version
  # token) and only checks per-symbol CRCs + the vermagic flag-tail, so matching
  # the exact source SHA makes the stock vendor .ko files load unchanged.
  # Extracted from on-device UTS_RELEASE: 6.6.102-android15-8-g1481f357a31c-ab14794947-4k
  # Full SHA resolved via android.googlesource.com (VERIFIED SUBLEVEL=102):
  STOCK_COMMON_SHA: "1481f357a31cf37eeda2f6a98b9d80c8b78184de"
  STOCK_BUILD_NUMBER: "14794947"
  # v0.2.1: instead of repo-syncing branch tip and re-pinning common/ afterwards
  # (v0.2 failed: repo checkouts have no 'origin' remote), we repo-init against
  # Google CI's per-build manifest for ab/14794947. That pins EVERY project
  # (common, toolchain, Kleaf, prebuilts) to the exact revisions Google used to
  # build the stock kernel -> byte-identical CRC environment.
  STOCK_MANIFEST_URL: "https://ci.android.com/builds/submitted/14794947/kernel_aarch64/latest/raw/manifest_14794947.xml"
  # ksun profile: pinned KernelSU-Next tag. v3.3.0 `config KSU depends on
  # KPROBES && EXT4_FS`, both already =y in stock. Kprobe hook mode = no patches
  # to common/ core source, so exported-symbol CRCs stay intact.
  KSUN_TAG: "v3.3.0"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout CI repo
        uses: actions/checkout@v4

      - name: Set profile packaging vars
        run: |
          if [ "${{ inputs.profile }}" = "ksun" ]; then
            {
              echo "REL_VER=v0.8"
              echo "MODULE_SRC=flash-kit/ksun/module"
              echo "KIT_SRC=flash-kit/ksun"
              echo "WIFIZIP=s688ln-wifi-fix-v0.8-ksun.zip"
              echo "KIT=S688LN-kernel-v0.8-ksun"
            } >> "$GITHUB_ENV"
          else
            {
              echo "REL_VER=v0.6"
              echo "MODULE_SRC=flash-kit/v0.6/magisk-module"
              echo "KIT_SRC=flash-kit/v0.6"
              echo "WIFIZIP=s688ln-wifi-fix-v0.6.zip"
              echo "KIT=S688LN-kernel-v0.6-signed-modules"
            } >> "$GITHUB_ENV"
          fi

      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune --all --force 2>/dev/null || true
          echo "After:"; df -h /

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            git curl python3 python3-pip zip unzip rsync bc bison flex \
            libssl-dev libelf-dev ca-certificates
          # `repo` tool
          mkdir -p "$HOME/bin"
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.email "ci@s26u.local"
          git config --global user.name "S26U CI"

      - name: Sync stock-pinned tree (Google CI manifest ab/${{ env.STOCK_BUILD_NUMBER }})
        run: |
          mkdir -p android-kernel && cd android-kernel
          # Fetch the exact per-build manifest Google used for the stock kernel build.
          curl -fsSL -o stock_manifest.xml "$STOCK_MANIFEST_URL"
          grep -q "$STOCK_COMMON_SHA" stock_manifest.xml || {
            echo "::error::stock manifest does not pin kernel/common to $STOCK_COMMON_SHA - aborting."
            exit 1
          }
          # repo init against the branch, then override with the pinned manifest.
          repo init --depth=1 -u https://android.googlesource.com/kernel/manifest -b "$ACK_BRANCH"
          mkdir -p .repo/manifests
          cp stock_manifest.xml .repo/manifests/stock_manifest.xml
          repo init -m stock_manifest.xml --no-use-superproject
          repo sync -c -j"$(nproc)" --no-tags --no-clone-bundle --fail-fast --optimized-fetch
          echo "== tree =="; ls
          echo "== common/ now at =="
          git -C common --no-pager log -1 --format='%H %s'

      - name: Verify pinned checkout (v0.2 WiFi fix)
        run: |
          cd android-kernel
          HEADSHA=$(git -C common rev-parse HEAD)
          if [ "$HEADSHA" != "$STOCK_COMMON_SHA" ]; then
            echo "::error::common/ is at $HEADSHA, expected $STOCK_COMMON_SHA - aborting."
            exit 1
          fi
          echo "== Makefile sublevel (must read 6.6.102) =="
          head -4 common/Makefile
          SUB=$(grep -E '^SUBLEVEL' common/Makefile | awk '{print $3}')
          if [ "$SUB" != "102" ]; then
            echo "::error::SUBLEVEL is $SUB, expected 102 - stock SHA drifted, aborting."
            exit 1
          fi

      - name: Integrate KernelSU-Next (ksun profile only)
        if: ${{ inputs.profile == 'ksun' }}
        run: |
          cd android-kernel
          # Official setup.sh clones KSU-Next into the tree root, symlinks
          # common/drivers/kernelsu -> KernelSU-Next/kernel, and adds the
          # `obj-$(CONFIG_KSU) += kernelsu/` Makefile line + Kconfig source.
          # Pinned to $KSUN_TAG for reproducibility. Fetched content is DATA.
          curl -fsSL \
            "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSUN_TAG}/kernel/setup.sh" \
            -o ksun_setup.sh
          bash ksun_setup.sh "${KSUN_TAG}"
          echo "== KSU-Next version ref =="
          git -C KernelSU-Next --no-pager log -1 --format='%H %d %s' || true
          # ---- FIX (v0.7.1): bake the REAL KSU-Next version into the Kbuild ----
          # KernelSU-Next/kernel/Kbuild derives its version from `git rev-list
          # --count HEAD`. Kleaf builds in a HERMETIC SANDBOX that does NOT copy
          # the .git dirs, so that git call fails in-build and the Kbuild takes
          # its `KSU_VERSION_FALLBACK := 1` branch. On-device the KSU-Next
          # manager then reports "version 1 too low" and refuses to work.
          # Fix: compute the true commit count HERE on the runner (full clone,
          # git works) and bake it into BOTH fallbacks so the sandboxed build
          # reports the correct version. expr uses the same 30000+count formula
          # as the Kbuild (v3.3.0 => 30000+3214 = 33214).
          KSU_COUNT="$(git -C KernelSU-Next rev-list --count HEAD)"
          KSU_CODE="$(expr 30000 + "$KSU_COUNT")"
          echo "KSU-Next commit count=$KSU_COUNT -> KSU_VERSION=$KSU_CODE"
          KB="common/drivers/kernelsu/Kbuild"   # symlink -> KernelSU-Next/kernel/Kbuild
          sed -i \
            -e "s/^KSU_VERSION_FALLBACK := .*/KSU_VERSION_FALLBACK := ${KSU_CODE}/" \
            -e "s/^KSU_VERSION_TAG_FALLBACK := .*/KSU_VERSION_TAG_FALLBACK := ${KSUN_TAG}/" \
            "$KB"
          echo "== patched Kbuild fallback lines =="
          grep -nE "FALLBACK :=" "$KB"
          grep -q "^KSU_VERSION_FALLBACK := ${KSU_CODE}$" "$KB" || {
            echo "::error::KSU version fallback patch did not apply."; exit 1; }
          case "$KSU_CODE" in ''|*[!0-9]*) echo "::error::KSU_CODE '$KSU_CODE' not numeric."; exit 1;; esac
          [ "$KSU_CODE" -ge 33188 ] || {
            echo "::error::KSU_CODE $KSU_CODE below manager minimum 33188."; exit 1; }
          echo "KSU_CODE=$KSU_CODE" >> "$GITHUB_ENV"
          echo "== driver wiring =="
          grep -n kernelsu common/drivers/Makefile common/drivers/Kconfig || {
            echo "::error::KSU-Next wiring missing from common/drivers - setup.sh failed."; exit 1; }
          test -e common/drivers/kernelsu || {
            echo "::error::common/drivers/kernelsu symlink missing."; exit 1; }
          echo "KSU-Next ${KSUN_TAG} integrated."

      - name: Apply tuning profile (${{ inputs.profile }})
        if: ${{ inputs.profile != 'stock' }}
        run: |
          bash "$GITHUB_WORKSPACE/scripts/apply_tuning.sh" "${{ inputs.profile }}" \
               "$GITHUB_WORKSPACE/android-kernel/common"
          echo "== resulting gki_defconfig tail =="
          tail -30 android-kernel/common/arch/arm64/configs/gki_defconfig

      - name: Build GKI (Kleaf)
        env:
          # v0.5: BUILD_NUMBER + --config=stamp reproduce the FULL stock scmversion
          # (-g<sha12>-ab<number>). v0.2.1/v0.4 built WITHOUT stamping -> kernel
          # reported "6.6.102-android15-8-maybe-dirty-4k". The 14 missing WiFi/BT
          # modules are exactly the on-demand set resolved via kernel-release-keyed
          # lookup, so the maybe-dirty uname makes that lookup miss silently.
          # Exact stamp is the entire point of v0.5.
          BUILD_NUMBER: ${{ env.STOCK_BUILD_NUMBER }}
          KLEAF_MAKE_JOBS: 0
        run: |
          cd android-kernel
          # aggressive profile perturbs config -> don't let ABI strict mode hard-fail;
          # the fastboot-boot probe is the real gate for module loading.
          # NOTE: aggressive (ThinLTO + debug strip) CHANGES symbol CRCs vs stock and
          # will re-break the WCN/wlan modules -> WiFi. Only stock/safe are WiFi-safe.
          EXTRA="--config=stamp"
          if [ "${{ inputs.profile }}" = "aggressive" ]; then
            EXTRA="$EXTRA --kmi_symbol_list_strict_mode=false"
          fi
          # Primary path: Kleaf dist (produces Image, Image.lz4, boot.img, System.map).
          if tools/bazel run $EXTRA //common:kernel_aarch64_dist -- \
                --dist_dir="$GITHUB_WORKSPACE/dist"; then
            echo "kleaf_ok=1" >> "$GITHUB_ENV"
          else
            echo "Kleaf dist target failed; trying gki artifacts target..."
            tools/bazel run $EXTRA //common:kernel_aarch64_gki_artifacts_dist -- \
                --dist_dir="$GITHUB_WORKSPACE/dist" || \
            tools/bazel build $EXTRA //common:kernel_aarch64
          fi

      - name: Collect + pack boot image
        run: |
          cd "$GITHUB_WORKSPACE"
          echo "== dist contents =="; ls -la dist || true
          mkdir -p out
          # Copy the key artifacts if present
          for f in Image Image.lz4 System.map vmlinux boot.img gki-info.txt abi_symbollist; do
            [ -f "dist/$f" ] && cp "dist/$f" out/ && echo "collected $f"
          done
          # If Kleaf didn't emit a boot.img, build one from Image with mkbootimg.
          # S26U is Android 15 (init_boot split) => boot.img carries ONLY the kernel,
          # header v4, no ramdisk. init_boot + vendor_boot stay on the device.
          if [ ! -f out/boot.img ] && [ -f out/Image ]; then
            MKBOOT="$(find android-kernel -path '*tools/mkbootimg/mkbootimg.py' | head -1)"
            if [ -n "$MKBOOT" ]; then
              python3 "$MKBOOT" --header_version 4 --kernel out/Image \
                --output out/boot.img && echo "packed boot.img (no-ramdisk, v4)"
            fi
          fi
          # v0.6: keep this build's OWN SIGNED GKI modules. The v0.5 on-device
          # logs proved the last wall is module signing: stock rfkill.ko is
          # signed with Google's per-build key, our kernel only trusts modules
          # signed with THIS build's key ("rfkill: exports protected symbol
          # rfkill_alloc" -> EPERM). Same-run dist/*.ko carry the matching key.
          mkdir -p out/gki
          for m in rfkill mii usbnet asix ax88179_178a cdc_ether cdc_eem cdc_ncm r8152 r8153_ecm aqc111; do
            [ -f "dist/$m.ko" ] && cp "dist/$m.ko" out/gki/ && echo "collected gki/$m.ko"
          done
          echo "== out contents =="; ls -la out out/gki
          # NOTE: use find -type f, NOT globs - `*` matches the gki/ directory,
          # sha256sum errors on directories and `bash -e` then kills the step.
          ( cd out && find . -maxdepth 2 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt && cat SHA256SUMS.txt )

      - name: Verify KernelSU is compiled in (ksun hard gate)
        if: ${{ inputs.profile == 'ksun' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # 1) Config evidence: the build's .config must carry CONFIG_KSU=y.
          CFG="$(find android-kernel dist -name '.config' -type f 2>/dev/null | head -1)"
          CFG_OK=0
          if [ -n "$CFG" ] && grep -q '^CONFIG_KSU=y' "$CFG"; then
            echo "PASS: $CFG has CONFIG_KSU=y"; CFG_OK=1
          else
            echo "note: no .config with CONFIG_KSU=y found (Kleaf may not export it to dist); falling back to Image strings."
          fi
          # 2) Binary evidence: KernelSU strings baked into the kernel image.
          IMG_OK=0
          for f in out/Image out/vmlinux; do
            [ -f "$f" ] || continue
            if strings -a "$f" | grep -qiE 'kernelsu|KernelSU-Next|ksud|/data/adb/ksud'; then
              echo "PASS: KernelSU strings present in $f"; IMG_OK=1; break
            fi
          done
          if [ "$CFG_OK" = "1" ] || [ "$IMG_OK" = "1" ]; then
            echo "KSU integration confirmed."
          else
            echo "::error::No evidence of KernelSU in the built kernel (.config or Image). Aborting ksun build."
            exit 1
          fi

      - name: Verify v0.8 tier-A tuning landed (ksun hard gate)
        if: ${{ inputs.profile == 'ksun' }}
        run: |
          cd "$GITHUB_WORKSPACE"
          # The built .config must show all five EFFECTIVE v0.8 values:
          # the two choice selectors, the two derived strings they compute,
          # and KFENCE sampling off. Fails the build otherwise.
          CFG="$(find android-kernel dist -name '.config' -type f 2>/dev/null | head -1)"
          if [ -z "$CFG" ]; then
            echo "::error::No built .config found; cannot verify v0.8 tuning. Aborting."
            exit 1
          fi
          FAIL=0
          for want in \
            'CONFIG_DEFAULT_BBR=y' \
            'CONFIG_DEFAULT_TCP_CONG="bbr"' \
            'CONFIG_ZRAM_DEF_COMP_ZSTD=y' \
            'CONFIG_ZRAM_DEF_COMP="zstd"' \
            'CONFIG_KFENCE_SAMPLE_INTERVAL=0'
          do
            if grep -qxF "$want" "$CFG"; then
              echo "PASS: $want"
            else
              echo "::error::MISSING in built .config: $want"
              FAIL=1
            fi
          done
          [ "$FAIL" = "0" ] || { echo "::error::v0.8 tier-A tuning gate FAILED."; exit 1; }
          echo "v0.8 tier-A tuning confirmed in $CFG"

      - name: Verify kernel version string vs stock
        run: |
          cd "$GITHUB_WORKSPACE"
          SHORT_SHA="${STOCK_COMMON_SHA:0:12}"   # setlocalversion embeds 12-char abbrev
          EXPECT="6.6.102-android15-8-g${SHORT_SHA}-ab${STOCK_BUILD_NUMBER}-4k"
          GOT=""
          # UTS_RELEASE is embedded in Image; grep the printable version banner.
          if [ -f out/Image ]; then
            # The banner line in the Image is "<release> SMP preempt mod_unload ..." -
            # compare only the first token (the actual UTS_RELEASE / uname -r value).
            GOT=$(strings -a out/Image | grep -m1 -E '^6\.6\.102-android15' | awk '{print $1}' || true)
          fi
          echo "expected (stock): $EXPECT"
          echo "built:            $GOT"
          PREFIX="6.6.102-android15-8-g${SHORT_SHA}"
          if [ "${{ inputs.profile }}" = "ksun" ]; then
            # ksun integrates KernelSU-Next -> common/drivers is edited, so the
            # tree is no longer byte-identical to stock and the uname may carry a
            # suffix (e.g. a dirty marker). The invariant that MUST hold is that
            # we built the CORRECT pinned source + KMI generation + stamp: the
            # release string must START WITH the stock prefix (source SHA token).
            # The real WiFi/BT gate for ksun is the on-device fastboot-boot test.
            case "$GOT" in
              "${PREFIX}"*)
                echo "PASS (ksun): release string starts with the stock source prefix ($PREFIX)." ;;
              *)
                echo "::error::ksun release string '$GOT' does not start with '$PREFIX' - wrong source/stamp. Aborting."
                exit 1 ;;
            esac
          else
            # v0.5 HARD GATE: the release string must be byte-identical to stock.
            # v0.2.1 shipped with a "maybe-dirty" uname because this was only a
            # warning. The exact uname IS the experiment now - fail loudly instead.
            if [ "$GOT" = "$EXPECT" ]; then
              echo "PASS: kernel release string is byte-identical to stock."
            else
              echo "::error::kernel release string does not match stock exactly - the v0.5 hypothesis test would be invalid. Aborting."
              exit 1
            fi
          fi

      - name: Verify signed GKI modules (v0.6 hard gate)
        run: |
          cd "$GITHUB_WORKSPACE"
          SHORT_SHA="${STOCK_COMMON_SHA:0:12}"
          EXPECT="6.6.102-android15-8-g${SHORT_SHA}-ab${STOCK_BUILD_NUMBER}-4k"
          # rfkill.ko is the keystone: it must exist, carry the exact stock
          # vermagic, and carry an appended module signature (signed with this
          # build's key, which the Image trusts).
          test -f out/gki/rfkill.ko || { echo "::error::rfkill.ko missing from dist - v0.6 kit would be useless."; exit 1; }
          MODINFO="$(find android-kernel -name modinfo -type f | head -1)"
          if [ -z "$MODINFO" ]; then MODINFO="modinfo"; fi
          VM="$("$MODINFO" -F vermagic out/gki/rfkill.ko 2>/dev/null | awk '{print $1}' || true)"
          if [ -z "$VM" ]; then
            VM="$(strings -a out/gki/rfkill.ko | grep -m1 -oE '6\.6\.102-android15[^ ]*' || true)"
          fi
          echo "rfkill.ko vermagic release: $VM (expect $EXPECT)"
          if [ "${{ inputs.profile }}" = "ksun" ]; then
            # ksun's rfkill.ko is built by the ksun kernel, so its vermagic carries
            # the same (possibly suffixed) release string as the Image. What must
            # hold is that it came from the correct pinned source -> prefix match.
            PREFIX="6.6.102-android15-8-g${SHORT_SHA}"
            case "$VM" in
              "${PREFIX}"*) echo "PASS (ksun): rfkill.ko vermagic starts with the stock source prefix." ;;
              *) echo "::error::ksun rfkill.ko vermagic '$VM' lacks stock prefix '$PREFIX'."; exit 1 ;;
            esac
          else
            [ "$VM" = "$EXPECT" ] || { echo "::error::rfkill.ko vermagic does not match stock release string."; exit 1; }
          fi
          if tail -c 100 out/gki/rfkill.ko | grep -q "Module signature appended"; then
            echo "PASS: rfkill.ko carries an appended module signature."
          else
            echo "::error::rfkill.ko is NOT signed - kernel would reject it (protected exports)."
            exit 1
          fi

      - name: Build WiFi-fix Magisk module zip
        run: |
          cd "$GITHUB_WORKSPACE"
          MOD=magisk-mod-build
          rm -rf "$MOD" && mkdir -p "$MOD/gki"
          cp "$MODULE_SRC/module.prop" "$MOD/"
          cp "$MODULE_SRC/post-fs-data.sh" "$MOD/"
          cp "$MODULE_SRC/service.sh" "$MOD/"
          cp out/gki/*.ko "$MOD/gki/"
          # Magisk/KernelSU require module.prop at zip root.
          ( cd "$MOD" && zip -qr "../$WIFIZIP" . )
          unzip -l "$WIFIZIP"
          sha256sum "$WIFIZIP"

      - name: Assemble double-click flash kit (zip built on CI)
        run: |
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$KIT/backup" "$KIT/logs" "$KIT/check"
          cp out/boot.img "$KIT/"
          cp $KIT_SRC/*.bat $KIT_SRC/*.txt "$KIT/"
          cp "$WIFIZIP" "$KIT/"
          # v0.8: inject THIS build's real hashes into STEP-2 (placeholders in
          # the repo copy). Removes the post-build "hash-pin" commit dance and
          # guarantees the published kit's self-check matches its own contents.
          BOOT_HASH="$(sha256sum out/boot.img | awk '{print $1}')"
          ZIP_HASH="$(sha256sum "$WIFIZIP" | awk '{print $1}')"
          sed -i "s/__BOOT_SHA256__/$BOOT_HASH/;s/__WIFIZIP_SHA256__/$ZIP_HASH/" "$KIT/STEP-2-FLASH.bat"
          grep -q "$BOOT_HASH" "$KIT/STEP-2-FLASH.bat" || {
            echo "::error::boot.img hash injection into STEP-2 failed."; exit 1; }
          grep -q "$ZIP_HASH" "$KIT/STEP-2-FLASH.bat" || {
            echo "::error::wifi-zip hash injection into STEP-2 failed."; exit 1; }
          grep -q "set WIFIZIP=$WIFIZIP" "$KIT/STEP-2-FLASH.bat" || {
            echo "::error::STEP-2 WIFIZIP label drifted from build WIFIZIP ($WIFIZIP)."; exit 1; }
          echo "STEP-1 puts your stock kernel backup here." > "$KIT/backup/READ-ME.txt"
          echo "STEP-3 puts logs for Viktor here." > "$KIT/logs/READ-ME.txt"
          echo "STEP-1 puts read-only check results for Viktor here." > "$KIT/check/READ-ME.txt"
          # Bundle adb/fastboot so the kit is fully double-click ready.
          curl -fsSL -o pt.zip https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip -q pt.zip -d "$KIT"
          # Record the boot.img hash where STEP-2 can verify it.
          ( cd "$KIT" && sha256sum boot.img | awk '{print $1}' > EXPECTED-SHA256.txt )
          zip -qr "$KIT.zip" "$KIT"
          ls -la "$KIT.zip"
          sha256sum "$KIT.zip" out/boot.img

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s26u-gki-${{ inputs.profile }}
          path: |
            out/
            ${{ env.WIFIZIP }}
            ${{ env.KIT }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish kit as GitHub release (easy download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$GITHUB_WORKSPACE"
          TAG="${REL_VER}-${{ inputs.profile }}-run${{ github.run_id }}"
          if [ "${{ inputs.profile }}" = "ksun" ]; then
            NOTES="v0.8: everything v0.7.1 is (KernelSU-Next ${KSUN_TAG} compiled IN, version ${KSU_CODE}; exact-stamp GKI; this build's OWN SIGNED rfkill.ko + usbnet family via a root-agnostic loader) PLUS the tier-A tuning now baked into the kernel as FACTORY DEFAULTS instead of only runtime module writes: (1) default TCP congestion control bbr (was cubic), (2) default zram compressor zstd (was lzo-rle), (3) KFENCE sampling OFF by default (was 500ms). These are value-of-default changes only - no symbol/ABI/LTO change, so MODVERSIONS CRCs stay byte-identical to stock and the vendor WiFi/BT modules are unaffected (KMI strict mode stayed ON for this build). Your S26U-Flow/KernelBoost module keeps working unchanged - its runtime writes now simply confirm the same values. CRITICAL (unchanged): the module signing key is per-build, so use the boot.img and the wifi-fix zip FROM THIS SAME RELEASE together and remove any older s688ln_wifi_fix module first (a stale zip from another run is rejected -> 'rfkill: exports protected symbol rfkill_alloc' -> no WiFi/BT). STEP-2 now verifies its own hashes - injected at build time. A/B: fastboot boot ONLY, verify KSU manager=Working + WiFi + BT + ~248 modules before flashing. Kit includes boot.img, the matched fix module zip, platform-tools, and parse-safe .bat steps."
          else
            NOTES="Exact-stamp kernel + this build's OWN SIGNED GKI modules (rfkill & USB-net family) auto-loaded by a Magisk module. Fixes the v0.5 finding: kernel rejected Google-signed rfkill.ko ('exports protected symbol rfkill_alloc' -> EPERM), killing the whole WiFi/BT chain. Kit zip includes boot.img, the Magisk fix zip, platform-tools, and the parse-safe .bat steps."
          fi
          gh release create "$TAG" \
            --title "S688LN kernel ${REL_VER} (${{ inputs.profile }})" \
            --notes "$NOTES" \
            "${KIT}.zip" \
            "$WIFIZIP" \
            "out/SHA256SUMS.txt"
